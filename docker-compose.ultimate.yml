version: '3.9'

services:
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ultimate-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_SCHEDULE=0 * * * * *
      - WATCHTOWER_NOTIFICATIONS=email
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=noreply@zass.website
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=admin@zass.website
    command: --interval 60

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ultimate-autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ultimate-cadvisor
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: ultimate-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: ultimate-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      - GF_SERVER_ROOT_URL=https://monitor.zass.website
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  zass-ultimate:
    build: .
    container_name: zass-ultimate
    restart: always
    ports:
      - "16232:16232"
      - "16233:16233"
      - "16234:16234"
    environment:
      - NODE_ENV=production
      - AUTO_UPDATE=true
      - SELF_HEAL=true
      - SELF_EVOLVE=true
      - ULTIMATE_MODE=true
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - watchtower
      - autoheal
      - prometheus
      - grafana
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: ultimate-network
    driver: bridge
