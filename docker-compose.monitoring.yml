# docker-compose.monitoring.yml - Enterprise Monitoring Stack
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: zass-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - zass-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: zass-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - zass-monitoring

  loki:
    image: grafana/loki:latest
    container_name: zass-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - zass-monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: zass-promtail
    restart: always
    volumes:
      - /var/log:/var/log
      - ./logs:/app/logs
      - ./monitoring/promtail-config.yaml:/etc/promtail/promtail-config.yaml
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - zass-monitoring

  elasticsearch:
    image
