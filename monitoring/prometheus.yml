# monitoring/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    datacenter: tanzania

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'zass-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['zass-api-service:16232']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'zass-api'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-service:6379']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-service:27017']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-service:5432']
