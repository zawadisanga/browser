<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZASS Browser - Unlimited Web Browser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a2e;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Browser Header */
        .browser-header {
            background: #16213e;
            padding: 10px 20px;
            border-bottom: 1px solid #0f3460;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #0f3460;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #e94560;
            transform: scale(1.05);
        }

        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: #0f3460;
            border-radius: 24px;
            padding: 8px 16px;
        }

        .url-bar i {
            color: #888;
            margin-right: 10px;
        }

        #urlInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .go-btn {
            background: #e94560;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }

        .go-btn:hover {
            transform: scale(1.05);
            background: #ff6b81;
        }

        .action-btn {
            background: #0f3460;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: #e94560;
        }

        /* Browser Viewport */
        .viewport {
            flex: 1;
            background: white;
        }

        #browserFrame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Overlay */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
            text-align: center;
        }

        /* Sidebar for Bookmarks */
        .sidebar {
            position: fixed;
            right: -300px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: #16213e;
            z-index: 2000;
            transition: right 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .bookmark-item {
            background: #0f3460;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }

        .bookmark-item:hover {
            background: #e94560;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .toolbar {
                gap: 5px;
            }
            .nav-btn {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="toolbar">
            <button class="nav-btn" id="backBtn" title="Back"><i class="fas fa-arrow-left"></i></button>
            <button class="nav-btn" id="forwardBtn" title="Forward"><i class="fas fa-arrow-right"></i></button>
            <button class="nav-btn" id="reloadBtn" title="Reload"><i class="fas fa-sync-alt"></i></button>
            <button class="nav-btn" id="homeBtn" title="Home"><i class="fas fa-home"></i></button>
            
            <div class="url-bar">
                <i class="fas fa-lock" id="secureIcon"></i>
                <input type="text" id="urlInput" placeholder="Search or enter website URL...">
                <button class="go-btn" id="goBtn"><i class="fas fa-arrow-right"></i></button>
            </div>
            
            <button class="action-btn" id="bookmarkBtn" title="Bookmark"><i class="fas fa-bookmark"></i></button>
            <button class="action-btn" id="fullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
        </div>
    </div>
    
    <div class="viewport">
        <iframe id="browserFrame" title="Browser" src="https://www.google.com"></iframe>
    </div>
    
    <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i> Loading...
    </div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bookmark"></i> Bookmarks</h3>
            <button class="close-sidebar" id="closeSidebarBtn">&times;</button>
        </div>
        <div id="sidebarContent"></div>
    </div>

    <script>
        const browserFrame = document.getElementById('browserFrame');
        const urlInput = document.getElementById('urlInput');
        const loading = document.getElementById('loading');
        
        let currentUrl = 'https://www.google.com';
        let history = [currentUrl];
        let historyIndex = 0;
        let bookmarks = JSON.parse(localStorage.getItem('browserBookmarks') || '[]');
        
        function showLoading() {
            loading.style.display = 'block';
        }
        
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        async function navigateTo(url) {
            showLoading();
            
            let targetUrl = url.trim();
            if (!targetUrl) return;
            
            // Check if it's a search query
            if (!targetUrl.includes('.') && !targetUrl.startsWith('http')) {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(targetUrl)}`;
            } else if (!targetUrl.startsWith('http')) {
                targetUrl = 'https://' + targetUrl;
            }
            
            try {
                const response = await fetch(`/api/browser/browse?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                
                if (data.success) {
                    const doc = browserFrame.contentDocument || browserFrame.contentWindow.document;
                    doc.open();
                    doc.write(data.content);
                    doc.close();
                    
                    urlInput.value = data.url;
                    currentUrl = data.url;
                    
                    // Update history
                    history = history.slice(0, historyIndex + 1);
                    history.push(data.url);
                    historyIndex++;
                    
                    // Update secure icon
                    const secureIcon = document.getElementById('secureIcon');
                    if (data.url.startsWith('https')) {
                        secureIcon.className = 'fas fa-lock';
                        secureIcon.style.color = '#4cd964';
                    } else {
                        secureIcon.className = 'fas fa-lock-open';
                        secureIcon.style.color = '#ff4757';
                    }
                } else {
                    browserFrame.src = targetUrl;
                    urlInput.value = targetUrl;
                }
            } catch (error) {
                browserFrame.src = targetUrl;
                urlInput.value = targetUrl;
            }
            
            hideLoading();
        }
        
        function goBack() {
            if (historyIndex > 0) {
                historyIndex--;
                navigateTo(history[historyIndex]);
            } else {
                browserFrame.contentWindow.history.back();
            }
        }
        
        function goForward() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                navigateTo(history[historyIndex]);
            } else {
                browserFrame.contentWindow.history.forward();
            }
        }
        
        function reload() {
            navigateTo(currentUrl);
        }
        
        function goHome() {
            navigateTo('https://www.google.com');
        }
        
        function addBookmark() {
            const bookmark = {
                id: Date.now(),
                url: currentUrl,
                title: document.title,
                date: new Date().toISOString()
            };
            
            if (!bookmarks.find(b => b.url === bookmark.url)) {
                bookmarks.unshift(bookmark);
                localStorage.setItem('browserBookmarks', JSON.stringify(bookmarks));
                alert('✅ Bookmark added!');
            } else {
                alert('⚠️ Already bookmarked');
            }
        }
        
        function showBookmarks() {
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebarContent');
            
            sidebarContent.innerHTML = '';
            
            if (bookmarks.length === 0) {
                sidebarContent.innerHTML = '<p style="color: #888; text-align: center;">No bookmarks yet</p>';
            } else {
                bookmarks.forEach(bookmark => {
                    const div = document.createElement('div');
                    div.className = 'bookmark-item';
                    div.innerHTML = `
                        <div><strong>${bookmark.title.substring(0, 40)}</strong></div>
                        <div style="font-size: 11px; color: #888;">${bookmark.url.substring(0, 50)}</div>
                        <div style="margin-top: 8px;">
                            <button onclick="event.stopPropagation(); navigateTo('${bookmark.url}')" style="background: #e94560; border: none; padding: 4px 12px; border-radius: 4px; color: white; cursor: pointer; margin-right: 5px;">Open</button>
                            <button onclick="event.stopPropagation(); removeBookmark(${bookmark.id})" style="background: transparent; border: 1px solid #ff4757; padding: 4px 12px; border-radius: 4px; color: #ff4757; cursor: pointer;">Delete</button>
                        </div>
                    `;
                    div.onclick = () => { navigateTo(bookmark.url); closeSidebar(); };
                    sidebarContent.appendChild(div);
                });
            }
            
            sidebar.classList.add('open');
        }
        
        function removeBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            localStorage.setItem('browserBookmarks', JSON.stringify(bookmarks));
            showBookmarks();
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                document.exitFullscreen();
                document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-expand"></i>';
            }
        }
        
        // Event Listeners
        document.getElementById('goBtn').addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) navigateTo(url);
        });
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const url = urlInput.value.trim();
                if (url) navigateTo(url);
            }
        });
        
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.getElementById('forwardBtn').addEventListener('click', goForward);
        document.getElementById('reloadBtn').addEventListener('click', reload);
        document.getElementById('homeBtn').addEventListener('click', goHome);
        document.getElementById('bookmarkBtn').addEventListener('click', addBookmark);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
        
        browserFrame.addEventListener('load', () => {
            hideLoading();
        });
        
        // Initial navigation
        navigateTo('https://www.google.com');
    </script>
</body>
</html>
