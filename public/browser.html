<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZASS Browser - ZASS Only | Unlimited Web Browser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .browser-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 20px;
            border-bottom: 2px solid #e94560;
        }
        
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .zass-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 6px 15px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
        }
        
        .zass-logo i { font-size: 18px; }
        
        .nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        
        .nav-btn:hover { background: #e94560; transform: scale(1.05); }
        
        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.15);
            border-radius: 30px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .url-bar i { color: #aaa; margin-right: 10px; }
        
        #urlInput {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            color: white;
            font-size: 14px;
            outline: none;
        }
        
        #urlInput::placeholder { color: rgba(255,255,255,0.6); }
        
        .go-btn {
            background: #e94560;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        
        .go-btn:hover { transform: scale(1.05); background: #ff6b81; }
        
        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        
        .action-btn:hover { background: #e94560; }
        
        .viewport { flex: 1; background: white; position: relative; }
        
        #browserFrame { width: 100%; height: 100%; border: none; }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
            text-align: center;
        }
        
        .loading i { font-size: 30px; margin-bottom: 10px; }
        
        .zass-status {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #e94560;
        }
        
        .zass-status span i { margin-right: 5px; }
        
        .sidebar {
            position: fixed;
            right: -320px;
            top: 0;
            width: 320px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            z-index: 2000;
            transition: right 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar.open { right: 0; }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            padding-bottom: 10px;
            border-bottom: 1px solid #e94560;
        }
        
        .close-sidebar {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .bookmark-item {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        
        .bookmark-item:hover { background: #e94560; transform: translateX(-5px); }
        
        @media (max-width: 768px) {
            .toolbar { gap: 6px; }
            .nav-btn, .action-btn { width: 34px; height: 34px; font-size: 12px; }
            .zass-logo span { display: none; }
        }
    </style>
</head>
<body>
    <div class="browser-header">
        <div class="toolbar">
            <div class="zass-logo">
                <i class="fas fa-globe"></i>
                <span>ZASS ONLY</span>
            </div>
            
            <button class="nav-btn" id="backBtn" title="Go Back"><i class="fas fa-arrow-left"></i></button>
            <button class="nav-btn" id="forwardBtn" title="Go Forward"><i class="fas fa-arrow-right"></i></button>
            <button class="nav-btn" id="reloadBtn" title="Reload"><i class="fas fa-sync-alt"></i></button>
            <button class="nav-btn" id="homeBtn" title="Home"><i class="fas fa-home"></i></button>
            
            <div class="url-bar">
                <i class="fas fa-lock" id="secureIcon"></i>
                <input type="text" id="urlInput" placeholder="Search or enter website URL...">
                <button class="go-btn" id="goBtn"><i class="fas fa-arrow-right"></i></button>
            </div>
            
            <button class="action-btn" id="bookmarkBtn" title="Add Bookmark"><i class="fas fa-bookmark"></i></button>
            <button class="action-btn" id="fullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
        </div>
    </div>
    
    <div class="viewport">
        <iframe id="browserFrame" title="ZASS Browser" src="https://www.google.com"></iframe>
    </div>
    
    <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i><br>
        Loading ZASS Browser...
    </div>
    
    <div class="zass-status">
        <span><i class="fas fa-shield-alt"></i> ZASS Secure Mode</span>
        <span><i class="fas fa-infinity"></i> Unlimited Browsing</span>
        <span><i class="fas fa-ban"></i> No Censorship</span>
    </div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-bookmark"></i> ZASS Bookmarks</h3>
            <button class="close-sidebar" id="closeSidebarBtn">&times;</button>
        </div>
        <div id="sidebarContent"></div>
    </div>

    <script>
        const browserFrame = document.getElementById('browserFrame');
        const urlInput = document.getElementById('urlInput');
        const loading = document.getElementById('loading');
        
        let currentUrl = 'https://www.google.com';
        let history = [currentUrl];
        let historyIndex = 0;
        let bookmarks = JSON.parse(localStorage.getItem('zassBookmarks') || '[]');
        
        function showLoading() { loading.style.display = 'block'; }
        function hideLoading() { loading.style.display = 'none'; }
        
        async function navigateTo(url) {
            showLoading();
            
            let targetUrl = url.trim();
            if (!targetUrl) { hideLoading(); return; }
            
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
            if (!urlPattern.test(targetUrl) && !targetUrl.startsWith('http')) {
                targetUrl = `https://www.google.com/search?q=${encodeURIComponent(targetUrl)}`;
            } else if (!targetUrl.startsWith('http')) {
                targetUrl = 'https://' + targetUrl;
            }
            
            try {
                const response = await fetch(`/api/browser/browse?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                
                if (data.success && data.content) {
                    const doc = browserFrame.contentDocument || browserFrame.contentWindow.document;
                    doc.open();
                    doc.write(data.content);
                    doc.close();
                    
                    urlInput.value = data.url;
                    currentUrl = data.url;
                    document.title = 'ZASS Browser - ZASS Only';
                    
                    history = history.slice(0, historyIndex + 1);
                    history.push(data.url);
                    historyIndex++;
                    
                    const secureIcon = document.getElementById('secureIcon');
                    if (data.url.startsWith('https')) {
                        secureIcon.className = 'fas fa-lock';
                        secureIcon.style.color = '#4cd964';
                    } else {
                        secureIcon.className = 'fas fa-lock-open';
                        secureIcon.style.color = '#ff4757';
                    }
                } else {
                    browserFrame.src = targetUrl;
                    urlInput.value = targetUrl;
                }
            } catch (error) {
                browserFrame.src = targetUrl;
                urlInput.value = targetUrl;
            }
            
            hideLoading();
        }
        
        function goBack() {
            if (historyIndex > 0) {
                historyIndex--;
                navigateTo(history[historyIndex]);
            } else {
                try { browserFrame.contentWindow.history.back(); } catch(e) {}
            }
        }
        
        function goForward() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                navigateTo(history[historyIndex]);
            } else {
                try { browserFrame.contentWindow.history.forward(); } catch(e) {}
            }
        }
        
        function reload() { navigateTo(currentUrl); }
        function goHome() { navigateTo('https://www.google.com'); }
        
        function addBookmark() {
            const bookmark = {
                id: Date.now(),
                url: currentUrl,
                title: document.title || currentUrl,
                date: new Date().toISOString()
            };
            
            if (!bookmarks.find(b => b.url === bookmark.url)) {
                bookmarks.unshift(bookmark);
                localStorage.setItem('zassBookmarks', JSON.stringify(bookmarks));
                alert('✅ Bookmark added to ZASS!');
                if (document.getElementById('sidebar').classList.contains('open')) showBookmarks();
            } else {
                alert('⚠️ Already in ZASS bookmarks');
            }
        }
        
        function showBookmarks() {
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebarContent');
            
            sidebarContent.innerHTML = '';
            
            if (bookmarks.length === 0) {
                sidebarContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #888;"><i class="fas fa-bookmark" style="font-size: 48px; margin-bottom: 15px;"></i><p>No ZASS bookmarks yet</p><small>Click the bookmark icon to add</small></div>';
            } else {
                bookmarks.forEach(bookmark => {
                    const div = document.createElement('div');
                    div.className = 'bookmark-item';
                    div.innerHTML = `
                        <div><strong>${bookmark.title.substring(0, 45)}</strong></div>
                        <div style="font-size: 10px; color: #aaa; margin-top: 5px;">${bookmark.url.substring(0, 60)}</div>
                        <div style="margin-top: 10px;">
                            <button onclick="event.stopPropagation(); navigateTo('${bookmark.url}')" style="background: #e94560; border: none; padding: 5px 12px; border-radius: 5px; color: white; cursor: pointer; margin-right: 8px;">🌐 Open</button>
                            <button onclick="event.stopPropagation(); removeBookmark(${bookmark.id})" style="background: transparent; border: 1px solid #ff4757; padding: 5px 12px; border-radius: 5px; color: #ff4757; cursor: pointer;">🗑️ Delete</button>
                        </div>
                    `;
                    div.onclick = () => { navigateTo(bookmark.url); closeSidebar(); };
                    sidebarContent.appendChild(div);
                });
            }
            
            sidebar.classList.add('open');
        }
        
        function removeBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            localStorage.setItem('zassBookmarks', JSON.stringify(bookmarks));
            showBookmarks();
        }
        
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                document.exitFullscreen();
                document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-expand"></i>';
            }
        }
        
        document.getElementById('goBtn').addEventListener('click', () => { const url = urlInput.value.trim(); if (url) navigateTo(url); });
        urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { const url = urlInput.value.trim(); if (url) navigateTo(url); } });
        document.getElementById('backBtn').addEventListener('click', goBack);
        document.getElementById('forwardBtn').addEventListener('click', goForward);
        document.getElementById('reloadBtn').addEventListener('click', reload);
        document.getElementById('homeBtn').addEventListener('click', goHome);
        document.getElementById('bookmarkBtn').addEventListener('click', addBookmark);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
        
        browserFrame.addEventListener('load', () => { hideLoading(); });
        
        navigateTo('https://www.google.com');
    </script>
</body>
</html>
