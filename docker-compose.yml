version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: zass-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: zass
    volumes:
      - mongodb_data:/data/db
    networks:
      - zass-network

  postgresql:
    image: postgres:16
    container_name: zass-postgresql
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: zass
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - zass-network

  redis:
    image: redis:7-alpine
    container_name: zass-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - zass-network

  app:
    build: .
    container_name: zass-app
    restart: always
    ports:
      - "16232:16232"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/zass?authSource=admin
      DATABASE_URL: postgresql://postgres:postgres123@postgresql:5432/zass
      REDIS_URL: redis://:redis123@redis:6379
    depends_on:
      - mongodb
      - postgresql
      - redis
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - zass-network

  nginx:
    image: nginx:alpine
    container_name: zass-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - zass-network

networks:
  zass-network:
    driver: bridge

volumes:
  mongodb_data:
  postgresql_data:
  redis_data:
  uploads:
  logs:
