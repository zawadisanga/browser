# docker-compose.godmode.yml - GOD MODE Infrastructure
version: '3.9'

services:
  # Core Services
  zass-api:
    build:
      context: .
      dockerfile: Dockerfile.godmode
    container_name: zass-godmode-api
    restart: always
    ports:
      - "16232:16232"
      - "16233:16233" # WebSocket
    environment:
      - NODE_ENV=production
      - BUN_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      - mongodb
      - postgresql
      - redis
      - kafka
      - elasticsearch
    networks:
      - zass-godmode
    deploy:
      mode: replicated
      replicas: 10
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Databases
  mongodb:
    image: mongodb/mongodb-enterprise:latest
    container_name: zass-godmode-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - zass-godmode
    deploy:
      resources:
        limits:
          memory: 16G

  postgresql:
    image: postgres:16-alpine
    container_name: zass-godmode-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=zass
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=zass_godmode
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zass-godmode
    deploy:
      resources:
        limits:
          memory: 8G

  redis:
    image: redis/redis-stack:latest
    container_name: zass-godmode-redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - zass-godmode
    deploy:
      resources:
        limits:
          memory: 8G

  # Message Queue
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: zass-godmode-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    networks:
      - zass-godmode

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zass-godmode-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - zass-godmode

  # Search & Analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: zass-godmode-elastic
    restart: always
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms8g -Xmx8g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - zass-godmode
    deploy:
      resources:
        limits:
          memory: 16G

  # AI & ML
  chromadb:
    image: chromadb/chroma:latest
    container_name: zass-godmode-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - zass-godmode

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zass-godmode-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - zass-godmode

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: zass-godmode-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - zass-godmode

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: zass-godmode-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - zass-godmode

  loki:
    image: grafana/loki:latest
    container_name: zass-godmode-loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - zass-godmode

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: zass-godmode-jaeger
    restart: always
    ports:
      - "16686:16686"
    networks:
      - zass-godmode

  # Blockchain
  ganache:
    image: trufflesuite/ganache:latest
    container_name: zass-godmode-ganache
    restart: always
    ports:
      - "8545:8545"
    command: --wallet.seed "zassgodmode" --server.host 0.0.0.0
    networks:
      - zass-godmode

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: zass-godmode-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - zass-api
    networks:
      - zass-godmode

networks:
  zass-godmode:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb_data:
  mongodb_config:
  postgres_data:
  redis_data:
  elasticsearch_data:
  chroma_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  loki_data:
